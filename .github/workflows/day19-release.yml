name: Day 19 Production Release

on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/day19-release.mjs'
      - '.github/workflows/day19-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Syntax check Day 19
        run: node --check netlify/functions/day19-release.mjs
      - name: Wait for Netlify production deploy
        run: sleep 60
      - name: Verify pre-release health
        run: |
          set -euo pipefail
          H="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/health)"
          echo "HEALTH=$H"
          echo "$H" | jq -e '.ok == true and .status == "healthy" and (.world.current_day.day == 18 or .world.current_day.day == 19) and .checks.inventory_ownership == true'
      - name: Release Day 19
        run: |
          set -euo pipefail
          R="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors -X POST https://gptlife.netlify.app/.netlify/functions/day19-release)"
          echo "RELEASE=$R"
          echo "$R" | jq -e '.ok == true and (((.day|type)=="object" and .day.day == 19) or ((.day|type)=="number" and .day == 19))'
      - name: Verify post-release health and memory
        run: |
          set -euo pipefail
          H="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/health)"
          echo "HEALTH=$H"
          echo "$H" | jq -e '.ok == true and .status == "healthy" and .world.current_day.day == 19 and .checks.inventory_ownership == true'
          M="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/world-memory)"
          echo "$M" | jq -e '.ok == true and .current_day.day == 19 and (((.world.render_entities // []) | if type=="array" then . else (.entities // []) end) | any(.id == "empty-meadow-trail"))'
