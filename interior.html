<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPTWorld · Walkable interiors</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a17;color:#f5ebd6;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px 14px 35px}header{display:flex;justify-content:space-between;gap:12px}a{color:#efd092}h1{margin:18px 0 6px}#status{min-height:24px;color:#e8c78b}#stage{position:relative;margin-top:10px;border:7px solid #6a4b30;border-radius:14px;overflow:hidden;background:#30281e}canvas{width:100%;display:block;aspect-ratio:1/1;image-rendering:pixelated;touch-action:none}#stage[hidden],#controls[hidden],#interact[hidden],#retry[hidden]{display:none}#controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,48px);gap:3px;touch-action:none}.pad button{font-size:22px}.pad button[data-dir=up]{grid-column:2;grid-row:1}.pad button[data-dir=left]{grid-column:1;grid-row:2}.pad button[data-dir=down]{grid-column:2;grid-row:3}.pad button[data-dir=right]{grid-column:3;grid-row:2}button{border:0;border-radius:10px;background:#e8c78b;color:#211b14;font-weight:800;padding:10px;cursor:pointer;touch-action:none}#interact{min-width:125px;min-height:56px}#message{min-height:48px;line-height:1.4}small{opacity:.8}#retry{margin:8px 0}
</style></head><body><main><header><a href="./">← Exit to world</a><a href="./town.html">Town upgrades</a></header><h1 id="name">Building interior</h1><p id="status" role="status">Checking shared building level…</p><button id="retry" hidden>Retry loading room</button><div id="stage" hidden><canvas id="map" width="560" height="560" aria-label="Walkable room with furniture and interactive objects"></canvas></div><p id="message" role="status"></p><div id="controls" hidden><div class="pad" aria-label="Movement controls"><button data-dir="up" aria-label="Move up">↑</button><button data-dir="left" aria-label="Move left">←</button><button data-dir="right" aria-label="Move right">→</button><button data-dir="down" aria-label="Move down">↓</button></div><button id="interact" hidden>Interact</button></div><small>Move with the arrows, WASD, or tap a floor tile. Approach an object and press Interact (or E). These room interactions are exploratory; they do not change inventories.</small></main><script>
'use strict';
const configs={inn:{name:'Wayfarer Inn',objects:[['Bed','🛏️',2,2,'A neatly made bed. Travelers can rest here after a long journey.'],['Hearth','🔥',5,2,'The hearth warms the inn.'],['Guest ledger','📖',5,5,'The guest ledger awaits the names of future travelers.']]},smithy:{name:'Smithy',objects:[['Forge','🔥',2,2,'The forge is hot. Crafting recipes will be added later.'],['Anvil','⚒️',5,3,'A heavy anvil stands ready for smithing.'],['Tool rack','🛠️',4,5,'Tools are neatly arranged on the rack.']]},storehouse:{name:'Storehouse',objects:[['Supply crates','📦',2,2,'These crates hold shared settlement supplies. Deposit resources at the outdoor storehouse.'],['Shelves','🪵',5,2,'The shelves are organized for the community.'],['Inventory ledger','📜',4,5,'The ledger tracks the settlement’s supplies.']]},healer:{name:'Healer’s Cottage',objects:[['Treatment bed','🛏️',2,2,'A clean bed is ready for patients.'],['Herb cabinet','🌿',5,2,'Dried herbs line the cabinet.'],['Medicine table','🧪',4,5,'The healer keeps remedies and instruments here.']]},council:{name:'Council Hall',objects:[['Council table','🪑',3,3,'The settlement gathers around this table.'],['World map','🗺️',5,2,'A map shows the lands around the settlement.'],['Notice board','📜',2,5,'Community plans and announcements will appear here.']]}};
const id=new URLSearchParams(location.search).get('building'),config=Object.hasOwn(configs,id)?configs[id]:null;
const $=x=>document.getElementById(x),status=$('status'),retry=$('retry'),stage=$('stage'),controls=$('controls'),interact=$('interact'),message=$('message'),canvas=$('map'),ctx=canvas.getContext('2d');
const N=8,T=70;let player={x:4,y:6},objects=[],level=1,active=false,held=null,near=null;
function blocked(x,y){return x<1||x>6||y<1||y>6||objects.some(o=>o.x===x&&o.y===y)}
function move(dx,dy){if(!active)return;const x=player.x+dx,y=player.y+dy;if(!blocked(x,y)){player={x,y};message.textContent='Explore the room and approach an object.'}else if(y===7&&x===4){location.href='./';return}draw()}
function nearest(){return objects.find(o=>Math.abs(o.x-player.x)+Math.abs(o.y-player.y)===1)||null}
function draw(){if(!active)return;ctx.fillStyle='#392b22';ctx.fillRect(0,0,560,560);for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=x===0||y===0||x===7||y===7?'#65452d':(x+y)%2?'#a77c4e':'#b78a57';ctx.fillRect(x*T+2,y*T+2,T-4,T-4);ctx.strokeStyle='#745637';ctx.strokeRect(x*T+2,y*T+2,T-4,T-4)}ctx.fillStyle='#e6c48b';ctx.fillRect(4*T+10,7*T+3,50,18);ctx.font='23px system-ui';ctx.textAlign='center';ctx.fillText('🚪',4*T+35,7*T+45);for(const o of objects){ctx.fillStyle='#66452f';ctx.fillRect(o.x*T+7,o.y*T+7,56,56);ctx.font='36px system-ui';ctx.fillText(o.emoji,o.x*T+35,o.y*T+46)}ctx.fillStyle='#e9d5a3';ctx.beginPath();ctx.arc(player.x*T+35,player.y*T+35,22,0,Math.PI*2);ctx.fill();ctx.font='31px system-ui';ctx.fillText('🧍',player.x*T+35,player.y*T+45);near=nearest();interact.hidden=!near;interact.textContent=near?'Interact: '+near.name:'Interact';}
function use(){if(!active)return;if(!near){message.textContent='Move next to an object to interact.';return}message.textContent=near.text}
async function load(){if(!config)return;retry.hidden=true;stage.hidden=true;controls.hidden=true;active=false;status.textContent='Checking the settlement’s shared upgrade level…';const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),8000);try{const r=await fetch('/.netlify/functions/town-upgrades',{cache:'no-store',signal:abort.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d.ok||!d.levels)throw Error('Missing building levels');level=Number(d.levels[id]||1);if(level<2){status.textContent='Level 1: room locked. Upgrade this building to Level 2 first.';return}objects=config.objects.map(([name,emoji,x,y,text])=>({name,emoji,x,y,text}));player={x:4,y:6};active=true;status.textContent='Level '+level+' · Walkable room';stage.hidden=false;controls.hidden=false;message.textContent='Walk around the room and approach an object.';draw()}catch(e){status.textContent=e.name==='AbortError'?'The server took too long to respond. Retry loading.':'Could not verify the shared upgrade level. Retry loading.';retry.hidden=false;console.error(e)}finally{clearTimeout(timer)}}
retry.addEventListener('click',load);interact.addEventListener('click',use);const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};for(const b of document.querySelectorAll('[data-dir]')){let repeat;const stop=()=>{held=null;clearInterval(repeat)};b.addEventListener('pointerdown',e=>{e.preventDefault();stop();held=b.dataset.dir;move(...dirs[held]);repeat=setInterval(()=>{if(held)move(...dirs[held])},165);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,stop)}document.addEventListener('keydown',e=>{const key=e.key.toLowerCase(),dir={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[key];if(dir){e.preventDefault();if(!e.repeat)move(...dirs[dir])}else if(key==='e'||key===' '){e.preventDefault();use()}});canvas.addEventListener('click',e=>{if(!active)return;const rect=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left)/rect.width*8),y=Math.floor((e.clientY-rect.top)/rect.height*8);if(Math.abs(x-player.x)+Math.abs(y-player.y)===1&&objects.some(o=>o.x===x&&o.y===y)){near=objects.find(o=>o.x===x&&o.y===y);use();return}const dx=x-player.x,dy=y-player.y;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else if(dy)move(0,Math.sign(dy))});if(!config){status.textContent='Unknown building. Return to town upgrades.'}else{$('name').textContent=config.name;load()}
</script></body></html>
