<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPTWorld · Construction Stages Preview</title>
<style>
body{margin:0;background:#142019;color:#f3efe5;font:14px system-ui,sans-serif}
header{padding:14px 16px}h1{margin:0 0 6px;font-size:1.35rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:0 12px 24px}
.card{background:#223125;border:1px solid #52634b;border-radius:14px;overflow:hidden}
.card h2{margin:0;padding:10px 12px;font-size:14px;background:#1a261d}
canvas{display:block;width:100%;height:220px}
</style>
</head>
<body>
<header>
  <h1>Community Project construction stages</h1>
  <p>Procedural preview for Blacksmith Forge — same stage thresholds used in-game.</p>
</header>
<div class="grid" id="grid"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {projectByKey,constructionStage,structureRenderEntity,CONSTRUCTION_STAGES} from '../netlify/lib/town-projects-core.mjs';

function addBox(parent,color,size,pos){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardMaterial({color,roughness:.9}));
  mesh.position.set(...pos);parent.add(mesh);return mesh;
}
function renderStage(canvas,entity){
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a261d);
  const camera=new THREE.PerspectiveCamera(40,canvas.clientWidth/canvas.clientHeight,.1,100);
  camera.position.set(8,7,8);camera.lookAt(0,1,0);
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
  scene.add(new THREE.HemisphereLight(0xc7e7ff,0x38442d,1.4));
  const sun=new THREE.DirectionalLight(0xffedc6,1.6);sun.position.set(4,8,3);scene.add(sun);
  const g=new THREE.Group();
  const w=entity.width,d=entity.depth,stage=entity.constructionStage,h=entity.height;
  if(stage==='foundation'||stage==='frame'||entity.scaffold){
    addBox(g,0x6a5a45,[w*1.05,.12,d*1.05],[0,.06,0]);
    for(const [x,z,s] of[[-w*.32,d*.35,.55],[w*.28,-d*.3,.7],[w*.05,d*.05,.45]])addBox(g,0x86603d,[s,s*.7,s],[x,s*.35,z]);
  }
  if(stage!=='foundation')addBox(g,entity.wallColor,[w,h,d],[0,h/2,0]);
  if(entity.scaffold&&stage!=='complete'){
    for(const x of[-w*.52,w*.52])for(const z of[-d*.52,d*.52])addBox(g,0x4e3b29,[.1,Math.max(1.2,h+.4),.1],[x,Math.max(.6,h/2),z]);
  }
  if(stage==='frame')for(const x of[-w*.35,0,w*.35])addBox(g,0x5a4634,[.14,h,.14],[x,h/2,0]);
  if(entity.roofHeight>0||stage==='nearly'||stage==='complete'){
    const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.75,1.7,4),new THREE.MeshStandardMaterial({color:entity.roofColor,roughness:.95}));
    roof.position.y=h+.85;roof.rotation.y=Math.PI/4;g.add(roof);
  }
  if(stage==='complete'){
    addBox(g,0x55483d,[.7,2.8,.7],[-w*.28,h+1.1,-d*.2]);
    addBox(g,0x4b3422,[1.05,1.85,.16],[0,.925,d/2+.08]);
    const glow=new THREE.PointLight(0xff8a3a,1.2,6);glow.position.set(0,1.2,d*.2);g.add(glow);
  }
  scene.add(g);renderer.render(scene,camera);
}

const project=projectByKey('blacksmith');
const grid=document.getElementById('grid');
const samples=[10,30,60,80,100];
for(const percent of samples){
  const entity=structureRenderEntity(project,percent,{completed:percent>=100});
  const stage=constructionStage(percent);
  const card=document.createElement('article');card.className='card';
  card.innerHTML=`<h2>${percent}% · ${stage.label}</h2>`;
  const canvas=document.createElement('canvas');card.append(canvas);grid.append(card);
  requestAnimationFrame(()=>renderStage(canvas,entity));
}
</script>
</body>
</html>
