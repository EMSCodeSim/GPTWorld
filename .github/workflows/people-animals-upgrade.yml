name: One-shot wildlife identity upgrade
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recognizable wildlife details
        run: python scripts/wildlife-identity.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit wildlife identity
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Make wildlife species easier to recognize"
          git push
