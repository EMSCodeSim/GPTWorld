name: One-shot Gathering Motion v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add physical gathering feedback
        run: python scripts/gather-animation-v1.py
      - name: Syntax and entry checks
        run: |
          node --check main.js
          grep -q "function startGame" main.js
          grep -q "enterWorldBtn.addEventListener" main.js
          grep -q "animateGather" main.js
          grep -q "gather-motion-1" index.html
      - name: Commit gathering motion
        run: |
          git config user.name "GPTWorld UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Add physical gathering animations and resource motion"
          git push
