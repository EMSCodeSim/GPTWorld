<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPTWorld · Building interior</title><style>*{box-sizing:border-box}body{margin:0;background:#101a17;color:#f5ebd6;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 60px}a{color:#efd092}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin-bottom:5px}.room{position:relative;margin-top:24px;height:min(65vh,480px);min-height:310px;overflow:hidden;border:12px solid #60432c;border-radius:18px;background:linear-gradient(145deg,#bfa67a,#8c704f);box-shadow:inset 0 0 0 8px #795b3c,0 18px 40px #0007}.floor{position:absolute;inset:45% 0 0;background:repeating-linear-gradient(0deg,#77583d 0 4px,#906d48 5px 52px);transform:perspective(300px) rotateX(15deg);transform-origin:top}.window{position:absolute;top:13%;left:12%;width:100px;height:100px;border:10px solid #64482f;border-radius:50% 50% 6px 6px;background:linear-gradient(#89b9c6,#a4caa1)}.furniture{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);font-size:clamp(65px,14vw,120px);filter:drop-shadow(8px 14px 5px #0005)}.details{position:absolute;top:12%;right:7%;padding:12px;border:2px solid #65482c;background:#f1dbad;color:#33291d;border-radius:8px;max-width:40%;font-weight:700}#status{min-height:28px}button{padding:12px;border:0;border-radius:9px;background:#e8c78b;font-weight:700;cursor:pointer}button:disabled{opacity:.5}</style></head><body><main><header><a href="./">← Exit to world</a><a href="./town.html">Town upgrades</a></header><h1 id="name">Building interior</h1><p id="status" role="status">Checking the settlement's shared upgrade level…</p><section class="room" id="room" hidden aria-label="Building room"><div class="floor"></div><div class="window"></div><div class="details" id="details"></div><div class="furniture" id="furniture" aria-hidden="true"></div></section><p id="description"></p></main><script>const rooms={inn:{name:'Wayfarer Inn',object:'🛏️',description:'A welcoming guest room for travelers to rest after exploring.'},smithy:{name:'Smithy',object:'⚒️',description:'A working forge and tool bench for the settlement.'},storehouse:{name:'Storehouse',object:'📦',description:'Shelves and crates hold the community’s shared resources.'},healer:{name:'Healer’s Cottage',object:'🌿',description:'A quiet treatment room with herbs and supplies.'},council:{name:'Council Hall',object:'🗺️',description:'A council chamber for planning the settlement’s future.'}};const id=new URLSearchParams(location.search).get('building');const room=Object.hasOwn(rooms,id)?rooms[id]:null;const status=document.getElementById('status');if(!room){status.textContent='Unknown building. Return to the world.'}else{document.getElementById('name').textContent=room.name;fetch('/.netlify/functions/town-upgrades',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok)throw Error('Could not verify upgrades');const level=Number(d.levels?.[id]||1);if(level<2){status.textContent='This building is Level 1 and remains closed. Upgrade it to Level 2 to enter.';return}status.textContent='Level '+level+' · Interior unlocked for all travelers';document.getElementById('room').hidden=false;document.getElementById('details').textContent=level===3?'Expanded '+room.name+' · Level 3':room.name+' · Level 2';document.getElementById('furniture').textContent=room.object;document.getElementById('description').textContent=room.description+(level===3?' The expanded room reflects the Level 3 upgrade.':'')}).catch(()=>status.textContent='Unable to verify this building’s level. Please try again.')}};</script></body></html>
