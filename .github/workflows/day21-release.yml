name: Day 21 Production Release
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/day21-release.mjs'
      - '.github/workflows/day21-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: node --check netlify/functions/day21-release.mjs
      - name: Wait for production
        run: sleep 75
      - name: Verify pre-release production health
        run: |
          set -euo pipefail
          H="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/health)"
          echo "$H" | jq -e '.ok == true and .status == "healthy" and (.world.current_day.day == 20 or .world.current_day.day == 21) and .checks.inventory_ownership == true'
      - name: Release exactly Day 21
        env:
          RELEASE_TOKEN: ${{ secrets.GPTWORLD_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TOKEN"
          R="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors -X POST -H "Authorization: Bearer $RELEASE_TOKEN" https://gptlife.netlify.app/.netlify/functions/day21-release)"
          echo "$R" | jq -e '.ok == true and .day == 21'
      - name: Verify persistence
        run: |
          set -euo pipefail
          H="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/health)"
          echo "$H" | jq -e '.ok == true and .status == "healthy" and .world.current_day.day == 21 and .checks.inventory_ownership == true'
          M="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/world-memory)"
          echo "$M" | jq -e '.ok == true and .current_day.day == 21 and (((.world.render_entities // []) | if type=="array" then . else (.entities // []) end) | any(.id == "day21-blacksmith-stone-yard"))'
