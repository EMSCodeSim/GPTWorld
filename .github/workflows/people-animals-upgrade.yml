name: One-shot Plant Seed Bank v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent plant seeds
        run: python scripts/plant-seed-v1.py
      - name: Syntax check ecology
        run: node --check netlify/functions/world.mjs
      - name: Commit plant seed bank
        run: |
          git config user.name "GPTWorld Ecology Bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/world.mjs
          git commit -m "Add persistent plant seed bank v1"
          git push
