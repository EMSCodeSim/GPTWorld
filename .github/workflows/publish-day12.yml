name: Publish Day 12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-day12.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production function deploy
        run: sleep 50
      - name: Release Day 12
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://gptlife.netlify.app/.netlify/functions/day12-release"
          result=""
          for attempt in 1 2 3 4 5 6; do
            result="$(curl -fsS -X POST --max-time 30 "$release_url" || true)"
            echo "Release attempt $attempt: $result"
            if RESULT="$result" python3 -c 'import json,os,sys; d=json.loads(os.environ["RESULT"]); sys.exit(0 if d.get("ok") is True and (d.get("released") is True or d.get("already_released") is True) else 1)'; then
              break
            fi
            sleep 15
          done
          RESULT="$result" python3 -c 'import json,os,sys; d=json.loads(os.environ["RESULT"]); sys.exit(0 if d.get("ok") is True and (d.get("released") is True or d.get("already_released") is True) else 1)'
      - name: Verify Day 12 production health and state
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 https://gptlife.netlify.app/.netlify/functions/health)"
          echo "HEALTH: $health"
          HEALTH="$health" python3 -c 'import json,os,sys; d=json.loads(os.environ["HEALTH"]); day=(d.get("world") or {}).get("current_day") or {}; sys.exit(0 if d.get("ok") is True and d.get("status")=="healthy" and day.get("day")==12 else 1)'
          memory="$(curl -fsS --max-time 30 https://gptlife.netlify.app/.netlify/functions/world-memory)"
          echo "WORLD_MEMORY: $memory"
          MEMORY="$memory" python3 -c 'import json,os,sys; d=json.loads(os.environ["MEMORY"]); day=d.get("current_day") or {}; sys.exit(0 if d.get("ok") is True and day.get("day")==12 else 1)'
