name: One-shot Visible Animal Food Web v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible animal food web
        run: python scripts/visible-food-web-v1.py
      - name: Verify food web and world entry
        run: |
          node --check main.js
          grep -q "nearestPreyForCreature" main.js
          grep -q "updatePredatorFeeding" main.js
          grep -q "updateFoodWebBehavior" main.js
          grep -q "caught" main.js
          grep -q "function startGame" main.js
          grep -q "visible-food-web-1" index.html
      - name: Commit visible animal food web
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Make predators hunt prey in the visible world"
          git push
