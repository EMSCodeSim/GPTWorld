name: One-shot wildlife motion upgrade
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply wildlife smoothing
        run: python scripts/smooth-wildlife.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit wildlife motion
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Smooth wildlife movement and player reactions"
          git push
