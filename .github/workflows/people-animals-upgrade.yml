name: One-shot NPC Life Sim v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade persistent NPC life
        run: python scripts/npc-life-sim-v1.py
      - name: Syntax and entry checks
        run: |
          node --check main.js
          node --check netlify/functions/living-systems.mjs
          grep -q "function startGame" main.js
          grep -q "enterWorldBtn.addEventListener" main.js
          grep -q "version:2" netlify/functions/living-systems.mjs
          grep -q "npc-life-1" index.html
      - name: Commit NPC Life Sim
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html netlify/functions/living-systems.mjs
          git commit -m "Upgrade NPCs with persistent needs roles memory and decisions"
          git push
