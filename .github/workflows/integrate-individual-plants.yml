name: Integrate persistent plants
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate-individual-plants.mjs'
      - 'lib/individual-plants.mjs'
      - 'tests/individual-plants.test.mjs'
      - '.github/workflows/integrate-individual-plants.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and tests
        run: |
          node --check lib/individual-plants.mjs
          node --check scripts/integrate-individual-plants.mjs
          node --test tests/individual-plants.test.mjs
      - name: Integrate lifecycle and renderer
        run: node scripts/integrate-individual-plants.mjs
      - name: Validate updated simulation
        run: |
          node --check netlify/functions/world.mjs
          node --check netlify/functions/_sim-core.mjs
          node --test tests/individual-plants.test.mjs
      - name: Commit integration
        run: |
          git config user.name 'gptworld-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add netlify/functions/world.mjs netlify/functions/_sim-core.mjs
          if ! git diff --cached --quiet; then git commit -m 'Connect persistent plants to ecology and visual growth'; git push; fi
