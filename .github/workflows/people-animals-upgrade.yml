name: One-shot terrain graphics polish
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add lightweight terrain variation
        run: python scripts/terrain-polish.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit terrain polish
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Add lightweight terrain variation"
          git push
