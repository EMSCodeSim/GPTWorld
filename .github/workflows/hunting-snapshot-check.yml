name: Hunting Snapshot Check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hunting-snapshot-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --test test/survival-core.test.mjs test/survival-contract.test.mjs
      - run: npm run check
