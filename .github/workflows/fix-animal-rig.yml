name: Animal rig repair
on:
  push:
    paths:
      - '.github/workflows/fix-animal-rig.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/fix_animal_rig.py
      - name: Check JavaScript
        run: |
          node --check main.js
          node --check netlify/functions/_sim-core.mjs
      - name: Commit repair
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js netlify/functions/_sim-core.mjs index.html
          git commit -m "Keep animal heads and legs attached"
          git push
