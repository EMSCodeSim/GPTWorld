name: One-shot Tree Interaction Fix v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair tree and plant interaction
        run: python scripts/fix-tree-interaction-v1.py
      - name: Verify tree interaction and world entry
        run: |
          node --check main.js
          grep -q 'Inspect ${nearest.label}' main.js
          grep -q 'interact again' main.js
          grep -q 'plantInfo' main.js
          grep -q 'function startGame' main.js
          grep -q 'tree-interaction-fix-1' index.html
      - name: Commit tree interaction repair
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Repair tree inspection and separate gathering action"
          git push
