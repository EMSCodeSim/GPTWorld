name: One-shot Wildlife Life Cycle v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add predation reproduction and death
        run: python scripts/predation-reproduction-death-v1.py
      - name: Syntax check ecology functions
        run: |
          node --check netlify/functions/world.mjs
          node --check netlify/functions/_sim-core.mjs
      - name: Commit wildlife life cycle
        run: |
          git config user.name "GPTWorld Ecology Bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/world.mjs netlify/functions/_sim-core.mjs
          git commit -m "Add predation reproduction and death v1"
          git push
