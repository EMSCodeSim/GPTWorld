name: Production Snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read live health and world memory
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HEALTH ==="
          curl -fsS --max-time 20 https://gptlife.netlify.app/.netlify/functions/health
          echo
          echo "=== WORLD_MEMORY ==="
          curl -fsS --max-time 30 https://gptlife.netlify.app/.netlify/functions/world-memory
          echo
