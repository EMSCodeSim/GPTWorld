name: One-shot Interaction Identify Progress v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade interaction identification and collection feedback
        run: python scripts/interact-identify-gather-progress-v1.py
      - name: Syntax check client
        run: node --check main.js
      - name: Commit interaction UX
        run: |
          git config user.name "GPTWorld UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Identify nearby world objects and show collection progress"
          git push
