name: One-shot NPC Interaction v2
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contextual NPC interaction
        run: python scripts/npc-interaction-v2.py
      - name: Verify NPC interaction and world entry
        run: |
          node --check main.js
          node --check netlify/functions/living-systems.mjs
          grep -q "talkToNPC" main.js
          grep -q "npc_interact" netlify/functions/living-systems.mjs
          grep -q "function startGame" main.js
          grep -q "npc-interact-2" index.html
      - name: Commit NPC interaction
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html netlify/functions/living-systems.mjs
          git commit -m "Add NPC relationships contextual dialogue requests and work motion"
          git push
