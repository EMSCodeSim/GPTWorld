name: One-shot Disaster Ecology Impact v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect disasters to ecology
        run: python scripts/disaster-ecology-impact-v1.py
      - name: Syntax check disaster ecology functions
        run: |
          node --check netlify/functions/disaster-tick.mjs
          node --check netlify/functions/_sim-core.mjs
      - name: Commit disaster ecology upgrade
        run: |
          git config user.name "GPTWorld Ecology Bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/disaster-tick.mjs netlify/functions/_sim-core.mjs
          git commit -m "Let disasters physically reshape ecology v1"
          git push
