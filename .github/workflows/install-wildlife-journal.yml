name: Install wildlife journal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-wildlife-journal.mjs'
      - '.github/workflows/install-wildlife-journal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check wildlife-journal.js && node --check scripts/install-wildlife-journal.mjs
      - run: node scripts/install-wildlife-journal.mjs
      - run: grep -q 'wildlife-journal.js' index.html
      - name: Commit game page
        run: |
          git config user.name gptworld-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Display wildlife journal in public game'
            git push
          fi
