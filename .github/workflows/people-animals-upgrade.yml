name: One-shot Snow Accumulation v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add autonomous snow accumulation
        run: python scripts/snow-accumulation-v1.py
      - name: Verify snow system and world entry
        run: |
          node --check main.js
          node --check netlify/functions/_sim-core.mjs
          node --check netlify/lib/sim-core.mjs
          grep -q "snowDepthCm" netlify/functions/_sim-core.mjs
          grep -q "snowCover" netlify/functions/_sim-core.mjs
          grep -q "snowGround" main.js
          grep -q "function startGame" main.js
          grep -q "snow-accumulation-1" index.html
      - name: Commit snow accumulation
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html netlify/functions/_sim-core.mjs netlify/lib/sim-core.mjs
          git commit -m "Add persistent autonomous snow accumulation and melt"
          git push
