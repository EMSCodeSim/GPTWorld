name: Apply vegetation art upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-vegetation-art.yml'
      - 'scripts/apply-vegetation-art.mjs'
      - 'vegetation-art.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch renderer
        run: node scripts/apply-vegetation-art.mjs
      - name: Commit live integration
        run: |
          git config user.name "gptworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          if git diff --cached --quiet; then
            echo "No renderer changes needed"
          else
            git commit -m "Connect upgraded tree and plant graphics"
            git push
          fi
