name: One-shot Compact Info Weather UI
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Remove progress and combine info weather
        run: python scripts/remove-progress-combine-info.py
      - name: Syntax check client
        run: |
          node --check main.js
          node --check info-center.js
      - name: Commit compact UI
        run: |
          git config user.name "GPTWorld UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html info-center.js
          git commit -m "Remove gather progress and combine info with weather"
          git push
