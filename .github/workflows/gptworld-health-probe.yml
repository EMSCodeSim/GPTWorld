name: GPTWorld Production Health Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gptworld-health-probe.yml"
      - "netlify/functions/**"
      - "CHRONICLE.md"
      - "DAY*.md"
      - "main.js"
      - "world-gateway.mjs"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for production deploy
        run: sleep 45
      - name: Verify GPTWorld production health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/health)"
          echo "$HEALTH" | jq -e '.ok == true and .status == "healthy" and .checks.database == true and .checks.required_tables == true and .checks.current_day == true and .checks.shared_world_state == true and .checks.players_table == true and .checks.inventory_table == true and .checks.inventory_ownership == true and .checks.world_events_table == true and (.world.current_day.day | tonumber) >= 1'
          echo "EXPECTED_WORLD_DAY=$(echo "$HEALTH" | jq -r '.world.current_day.day')" >> "$GITHUB_ENV"
      - name: Read living world memory
        shell: bash
        run: |
          set -euo pipefail
          MEMORY="$(curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors https://gptlife.netlify.app/.netlify/functions/world-memory)"
          echo "$MEMORY" | jq -e --argjson day "$EXPECTED_WORLD_DAY" '.ok == true and (.current_day.day | tonumber) == $day and .population != null and .activity_24h != null and .evolution_context != null'
