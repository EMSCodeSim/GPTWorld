name: One-shot evolving world login
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade login and traveler names
        run: python scripts/login-world-update.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit login upgrade
        run: |
          git config user.name "GPTWorld UX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Explain evolving world and remember traveler names"
          git push
