<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPTWorld · Pixel World Preview</title>
<style>
  html,body{margin:0;height:100%;background:#142019;color:#f3efe5;font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
  .hud{position:fixed;left:14px;bottom:14px;z-index:2;max-width:min(420px,calc(100vw - 28px));padding:12px 14px;border:1px solid #52634b;background:rgba(18,28,20,.88);border-radius:12px}
  .hud h1{margin:0 0 4px;font:700 16px/1.2 "IBM Plex Sans",system-ui,sans-serif}
  .hud p{margin:0;color:#c9d2c4}
</style>
</head>
<body>
<div id="stage" aria-label="Isolated pixel-art world preview"></div>
<div class="hud">
  <h1>Isolated pixel preview</h1>
  <p>No traveler registration. Verifies terrain, props, directional pixel characters, and wildlife walk frames.</p>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
import {configureRetroRenderer,resizeRetroViewport,RETRO_SKY,RETRO_FOG_NEAR,RETRO_FOG_FAR} from '../lib/retro-visuals.mjs';
import {
  createPixelGroundMaterial,createPixelTrailMaterial,createPixelRoofMaterial,
  createPixelWaterMaterial,createPixelShoreMaterial,createPixelWallMaterial
} from '../lib/pixel-terrain.mjs';
import {createPixelHumanoid,animatePixelHumanoid,createPixelCreature,animatePixelCreature} from '../lib/pixel-beings.mjs';
import {createPixelDoorMaterial,createPixelWindow,createPixelBarrel,createPixelLivingPlantPart,createPixelCloud} from '../lib/pixel-props.mjs';
import {createPineArt,createHerbArt,createRockArt} from '../vegetation-art.js';

const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(RETRO_SKY);
scene.fog=new THREE.Fog(RETRO_SKY,RETRO_FOG_NEAR,RETRO_FOG_FAR);
const camera=new THREE.OrthographicCamera(-14,14,14,-14,.1,200);
camera.position.set(13,15.5,13);
const renderer=configureRetroRenderer(THREE,new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'}));
stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb5d6e8,0x3a442c,1.85));
const sun=new THREE.DirectionalLight(0xfff0cf,2.35);
sun.position.set(15,24,10);sun.castShadow=true;sun.shadow.mapSize.set(512,512);scene.add(sun);

const ground=new THREE.Mesh(new THREE.BoxGeometry(40,1,40),createPixelGroundMaterial(THREE,0x667d4e));
ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
const path=new THREE.Mesh(new THREE.BoxGeometry(3,.03,22),createPixelTrailMaterial(THREE,0x8e806d,3,22));
path.position.set(0,.03,2);path.receiveShadow=true;scene.add(path);
const water=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,.16,24),createPixelWaterMaterial(THREE));
water.position.set(-8,.02,6);scene.add(water);
const shore=new THREE.Mesh(new THREE.RingGeometry(4.05,5.1,28),createPixelShoreMaterial(THREE));
shore.rotation.x=-Math.PI/2;shore.position.set(-8,.028,6);shore.receiveShadow=true;scene.add(shore);

const building=new THREE.Group();building.position.set(4,0,-2);
const wall=new THREE.Mesh(new THREE.BoxGeometry(5,3.1,4.5),createPixelWallMaterial(THREE,0x9b815c));
wall.position.y=1.55;wall.castShadow=true;building.add(wall);
const roof=new THREE.Mesh(new THREE.ConeGeometry(4.2,2.1,4),createPixelRoofMaterial(THREE,0x5b3b2d));
roof.position.y=4;roof.rotation.y=Math.PI/4;roof.castShadow=true;building.add(roof);
const door=new THREE.Mesh(new THREE.BoxGeometry(1.15,2.05,.18),createPixelDoorMaterial(THREE));
door.position.set(0,1.025,2.35);building.add(door);
for(const x of[-1.3,1.3]){const win=createPixelWindow(THREE);win.position.set(x,1.85,2.36);building.add(win);}
const barrel=createPixelBarrel(THREE,1);barrel.position.set(2.2,0,1.4);building.add(barrel);
scene.add(building);
scene.add(createPixelCloud(THREE,2));
const meadow=createPixelLivingPlantPart(THREE,{part:'blade',width:.5,height:.9,color:0x6f9b55});
meadow.position.set(5.5,0,3.2);scene.add(meadow);

const pine=createPineArt(THREE,1);pine.group.position.set(-3,0,8);scene.add(pine.group);
const herbs=createHerbArt(THREE,1,1);herbs.position.set(1,0,7);scene.add(herbs);
const rock=createRockArt(THREE,1,0);rock.position.set(7,0,5);scene.add(rock);

const player=createPixelHumanoid(THREE,{outfit:0x8b7650,pack:true});
player.position.set(0,0,4);scene.add(player);
const npc=createPixelHumanoid(THREE,{outfit:0x455c6b,hair:0x3a2b23});
npc.position.set(2.4,0,1.2);scene.add(npc);
const creature=createPixelCreature(THREE,{color:0xb39a67,runner:true,bodyScale:1.05,width:.9,height:.75,depth:1.35});
creature.position.set(-1.2,0,3.4);creature.rotation.y=Math.PI*.15;scene.add(creature);
const predator=createPixelCreature(THREE,{color:0x6b4d38,predator:true,bodyScale:1.1,width:1,height:.8,depth:1.4});
predator.position.set(-3.2,0,1.6);predator.rotation.y=-Math.PI*.35;scene.add(predator);

camera.lookAt(player.position.x,.7,player.position.z);
function resize(){resizeRetroViewport(renderer,camera,stage.clientWidth,stage.clientHeight)}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function animate(t){
  requestAnimationFrame(animate);
  clock.getDelta();
  player.rotation.y=Math.atan2(Math.sin(t*.0008),Math.cos(t*.0008));
  animatePixelHumanoid(player,true,t,1.1);
  npc.userData.rig.armR.rotation.x=-.9+Math.sin(t*.01)*.35;
  animatePixelHumanoid(npc,false,t);
  creature.position.x=-2+Math.sin(t*.001)*.8;
  creature.rotation.y=Math.atan2(Math.cos(t*.001),Math.sin(t*.001)*.01||.01);
  animatePixelCreature(creature,true,t,'roaming');
  predator.rotation.y=t*.0006;
  animatePixelCreature(predator,true,t,'fleeing');
  water.position.y=.02+Math.sin(t*.0015)*.025;
  if(water.material.map){water.material.map.offset.y=(t*.00004)%1;water.material.map.needsUpdate=true;}
  camera.position.set(player.position.x+13,15.5,player.position.z+13);
  camera.lookAt(player.position.x,.7,player.position.z);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.__pixelPreviewReady=true;
window.__pixelPreviewActors={player,npc,creature,predator};
</script>
</body>
</html>
