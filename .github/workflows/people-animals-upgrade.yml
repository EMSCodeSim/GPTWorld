name: One-shot Plant Interaction Info v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add plant information to Interact
        run: python scripts/plant-interact-info-v1.py
      - name: Verify plant interaction and world entry
        run: |
          node --check main.js
          grep -q "plantInfo" main.js
          grep -q "Habitat:" main.js
          grep -q "evergreen tree" main.js
          grep -q "wild herb patch" main.js
          grep -q "function applyResourceRelocations(nodes={}){for" main.js
          grep -q "function startGame" main.js
          grep -q "plant-interact-info-1" index.html
      - name: Commit plant interaction information
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Show plant ecology and uses through Interact"
          git push
