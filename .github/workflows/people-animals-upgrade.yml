name: One-shot Day 5 Trail Markers
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement server-authoritative trail markers
        run: python scripts/day5-trail-markers.py
      - name: Verify playable implementation
        run: |
          node --check main.js
          node --check netlify/functions/world-v2.mjs
          grep -q "place_trail_marker" netlify/functions/world-v2.mjs
          grep -q "trail_marker_placed" netlify/functions/world-v2.mjs
          grep -q "Place Trail Marker" index.html
          grep -q "function startGame" main.js
          grep -q "restoreSavedPlayer" world-sync.js
          grep -q "action:'gather'" main.js
      - name: Commit playable Day 5 implementation
        run: |
          git config user.name "GPTWorld Evolution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html netlify/functions/world-v2.mjs
          git commit -m "Add server-authoritative player trail markers"
          git push
