name: One-shot Persistent Food Web Events v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect visible feeding to persistent world events
        run: python scripts/persistent-food-web-events-v1.py
      - name: Verify persistent ecology events and world entry
        run: |
          node --check main.js
          grep -q "recordEcologyEvent" main.js
          grep -q "ecology_grazing" main.js
          grep -q "ecology_predation" main.js
          grep -q "function startGame" main.js
          grep -q "persistent-food-web-1" index.html
      - name: Commit persistent food web events
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Record visible feeding and predation in world history"
          git push
