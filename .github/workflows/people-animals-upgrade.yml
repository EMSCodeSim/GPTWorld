name: One-shot Weather Sim visuals
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect visible weather to Weather Sim
        run: python scripts/weather-visuals.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit weather visuals
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Connect visible weather to Weather Sim"
          git push
