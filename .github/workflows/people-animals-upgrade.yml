name: One-shot Resource Redistribution v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add habitat resource redistribution
        run: python scripts/mobile-resource-redistribution-v1.py
      - name: Verify resource redistribution and world entry
        run: |
          node --check main.js
          node --check netlify/functions/resource-state.mjs
          grep -q "MOBILE_RESOURCES" netlify/functions/resource-state.mjs
          grep -q "relocatedPosition" netlify/functions/resource-state.mjs
          grep -q "applyResourceRelocations" main.js
          grep -q "function startGame" main.js
          grep -q "resource-redistribution-1" index.html
      - name: Commit resource redistribution
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html netlify/functions/resource-state.mjs
          git commit -m "Make depleted plant resources relocate instead of fixed respawn"
          git push
