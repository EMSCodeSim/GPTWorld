name: Integrate persistent plants
on:
  push:
    paths:
      - 'scripts/integrate-individual-plants.mjs'
      - 'lib/individual-plants.mjs'
      - 'lib/plant-lifecycle.mjs'
      - 'netlify/functions/resource-state.mjs'
      - 'netlify/functions/private-world.mjs'
      - 'netlify/lib/private-world-core.mjs'
      - 'main.js'
      - 'private-world.js'
      - 'migrations/007_persistent_plant_harvests.sql'
      - 'test/plant-lifecycle.test.mjs'
      - 'tests/individual-plants.test.mjs'
      - '.github/workflows/integrate-individual-plants.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lifecycle integration
        run: node scripts/integrate-individual-plants.mjs
      - name: Run complete checks
        run: |
          npm test
          npm run check
          git diff --exit-code
