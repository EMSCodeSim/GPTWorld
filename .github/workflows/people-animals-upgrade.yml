name: One-shot Emergency Entry Repair
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore working engine and keep latest UX
        run: python scripts/repair-entry-main-v1.py
      - name: Syntax check client
        run: |
          node --check main.js
          node --check info-center.js
      - name: Verify entry wiring
        run: |
          grep -q "function startGame" main.js
          grep -q "enterWorldBtn.addEventListener" main.js
          grep -q "entry-repair-2" index.html
      - name: Commit repair
        run: |
          git config user.name "GPTWorld Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Restore world entry after client engine overwrite"
          git push
