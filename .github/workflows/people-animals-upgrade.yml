name: One-shot Animal Social Ecology v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add herds packs shelters and breeding
        run: python scripts/animal-social-breeding-v1.py
      - name: Syntax check ecology
        run: |
          node --check netlify/functions/world.mjs
          node --check netlify/functions/_sim-core.mjs
      - name: Commit animal social ecology
        run: |
          git config user.name "GPTWorld Ecology Bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/world.mjs netlify/functions/_sim-core.mjs
          git commit -m "Add herds packs shelters and breeding seasons v1"
          git push
