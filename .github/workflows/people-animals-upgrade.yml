name: One-shot Visible Herbivore Feeding v1
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible herbivore feeding
        run: python scripts/visible-herbivore-feeding-v1.py
      - name: Verify feeding behavior and world entry
        run: |
          node --check main.js
          grep -q "nearestPlantForCreature" main.js
          grep -q "updateHerbivoreFeeding" main.js
          grep -q "seeking food" main.js
          grep -q "grazes on" main.js
          grep -q "function startGame" main.js
          grep -q "herbivore-feeding-1" index.html
      - name: Commit visible herbivore feeding
        run: |
          git config user.name "GPTWorld Systems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Make herbivores seek and visibly graze plants"
          git push
