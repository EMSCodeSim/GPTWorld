name: Day 13 Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/day13-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: echo "Day 13 checks complete"
