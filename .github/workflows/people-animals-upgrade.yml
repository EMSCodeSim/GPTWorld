name: One-shot humanoid graphics polish
on:
  push:
    paths:
      - '.github/workflows/people-animals-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish people and NPC graphics
        run: python scripts/humanoid-polish.py
      - name: Syntax check stable engine
        run: node --check main.js
      - name: Commit humanoid polish
        run: |
          git config user.name "GPTWorld Graphics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.js index.html
          git commit -m "Polish player and NPC character graphics"
          git push
