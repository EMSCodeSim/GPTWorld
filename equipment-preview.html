<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPTWorld — Avatar Equipment Preview</title>
  <style>
    html,body{margin:0;height:100%;background:#152018;color:#f3ead5;font-family:Georgia,serif}
    #stage{position:fixed;inset:0}
    .hud{position:fixed;left:16px;top:16px;z-index:2;max-width:320px;background:#1d2c2299;border:1px solid #a78c5e;border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px)}
    .hud h1{margin:0 0 6px;font-size:22px}
    .hud p{margin:0;font-size:13px;line-height:1.4;color:#d7d4c9}
  </style>
</head>
<body>
  <div class="hud">
    <h1>Cartoon traveler</h1>
    <p>Pixar-style adventurer with big eyes, soft proportions, reinforced bow, leather tunic, backpack, boots, and wooden shield. Idle → walk → draw.</p>
  </div>
  <div id="stage"></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import {createPixelHumanoid, animatePixelHumanoid} from './lib/pixel-beings.mjs?v=pixar-cartoon-2';
    import {applyAvatarEquipment} from './lib/avatar-equipment-3d.mjs?v=pixar-cartoon-2';
    import {CHARACTER_LAYER} from './lib/retro-visuals.mjs';

    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x152018, 1);
    stage.append(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 40);
    camera.position.set(2.4, 2.1, 4.2);
    camera.lookAt(0, 1.15, 0);
    camera.layers.enable(CHARACTER_LAYER);
    const hemi = new THREE.HemisphereLight(0xf4e7c8, 0x243028, 1.1);
    hemi.layers.enable(CHARACTER_LAYER);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff0d2, 1.2);
    key.position.set(3, 5, 2);
    key.layers.enable(CHARACTER_LAYER);
    scene.add(key);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3.2, 40),
      new THREE.MeshStandardMaterial({color: 0x3d5244, roughness: 0.95})
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const traveler = createPixelHumanoid(THREE, {
      outfit: 0x526f62,
      skin: 0xdca77d,
      hair: 0x553824,
      accent: 0x3d4850,
      pack: false
    });
    scene.add(traveler);

    const items = [
      {id: '1', key: 'reinforced-bow', name: 'Reinforced Bow', placed: false},
      {id: '2', key: 'leather-tunic', name: 'Leather Tunic', placed: false},
      {id: '3', key: 'leather-boots', name: 'Leather Boots', placed: false},
      {id: '4', key: 'traveler-backpack', name: 'Traveler Backpack', placed: false},
      {id: '5', key: 'wooden-shield', name: 'Wooden Shield', placed: false}
    ];
    applyAvatarEquipment(THREE, traveler, {
      slots: {head: null, chest: '2', legs: null, feet: '3', back: '4', mainHand: '1', offHand: '5'},
      items
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let t = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      t = now;
      const cycle = (now / 1000) % 8;
      const moving = cycle < 3.2;
      const attack = cycle > 4.2 && cycle < 5.4 ? Math.min(1, (cycle - 4.2) / 0.45) * (cycle < 5 ? 1 : Math.max(0, 1 - (cycle - 5) / 0.4)) : 0;
      animatePixelHumanoid(traveler, moving, now, 1, {attack});
      traveler.rotation.y = Math.sin(now * 0.00035) * 0.45;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
